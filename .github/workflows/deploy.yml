name: Deploy Next.js / React Site to Pages

on:
push:
branches: ["main"]

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: "pages"
cancel-in-progress: false

jobs:
deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup Node
uses: actions/setup-node@v4
with:
node-version: "20"

- name: Install dependencies
run: npm install

- name: Build site
run: npm run build

- name: Upload artifact
uses: actions/upload-pages-artifact@v3
with:
path: './out' # se seu projeto usa Next.js estático (ou './dist' para Vite)

- name: Deploy to GitHub Pages
id: deployment
uses: actions/deploy-pages@v4
